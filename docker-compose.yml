version: "3"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    user: 0:0
    environment:
      TZ: 'America/Sao_Paulo'
      WEBROOT: '/var/www/html'
      CREATE_LARAVEL_STORAGE: '1'
      COMPOSERMIRROR: 'https://mirrors.cloud.tencent.com/composer/'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./backend:/var/www/html
    command: ["./wait-for-it.sh", "mysql:3306", "--", "./start.sh"]
    networks:
      - networkapi
    depends_on:
      - mysql
    links:
      - mysql

  #Nginx Service
  webserver:
    image: nginx:latest
    #    restart: unless-stopped
    container_name: webserver
    user: 0:0
    ports:
      - "8000:80"
    environment:
      TZ: 'America/Sao_Paulo'
      WEBROOT: '/var/www/html'
    volumes:
      - ./backend:/var/www/html
      - ./docker/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    links:
      - backend:php-fpm
    networks:
      - networkapi
    depends_on:
      - backend

  frontend:
      image: node:18.16.0
      container_name: frontend
      user: "node"
      restart: always
      working_dir: /app
      volumes:
        - ./frontend:/app
      network_mode: host
      command: bash -c "npm install ; npm run dev"

  mysql:
    image: "mysql:8.0"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    restart: always
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "eloca"
      MYSQL_DATABASE: "eloca"
      MYSQL_USER: "eloca"
      MYSQL_PASSWORD: "eloca"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    networks:
      - networkapi
    security_opt:
      - seccomp:unconfined
networks:
  networkapi:
    driver: bridge
